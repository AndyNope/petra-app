            Width: =Parent.Width - 80
            X: =40
            Y: =76
      - LoginFormTitle:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(17, 24, 39, 1)
            FontWeight: =FontWeight.Semibold
            Height: =30
            Size: =16
            Text: ="Taxi anmelden"
            Visible: =IsBlank(gLoggedInTaxi)
            Width: =Parent.Width - 112
            X: =56
            Y: =92
      - LoginRadioLbl:
