          Properties:
            Color: =RGBA(55, 65, 81, 1)
            FontWeight: =FontWeight.Semibold
            Height: =24
            Text: ="Funknummer"
            Visible: =IsBlank(gLoggedInTaxi)
            Width: =Parent.Width - 112
            X: =56
            Y: =136
      - LoginRadioInput:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =RGBA(209, 213, 219, 1)
            BorderThickness: =1
            FocusedBorderColor: =RGBA(59, 130, 246, 1)
