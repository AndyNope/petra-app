            HintText: ="z. B. T1"
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            RadiusTopLeft: =6
            RadiusTopRight: =6
            Size: =14
            Visible: =IsBlank(gLoggedInTaxi)
            Width: =Parent.Width - 112
            X: =56
            Y: =162
      - LoginZoneLbl:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(55, 65, 81, 1)
            FontWeight: =FontWeight.Semibold
            Height: =24
            Text: ="Aktueller Standort"
            Visible: =IsBlank(gLoggedInTaxi)
            Width: =Parent.Width - 112
            X: =56
            Y: =218
      - LoginZoneDropdown:
          Control: Classic/DropDown@2.3.1
          Properties:
            Default: ="A – Alpha"
            Height: =44
            Items: =["E – Echo","F – Foxtrot","H – Hotel","I – India","A – Alpha","B – Bravo","C – Charlie","D – Delta","T – Tango","G – Golf","P – Papa","W – Whisky"]
            Items.Value: =Value
            Visible: =IsBlank(gLoggedInTaxi)
            Width: =Parent.Width - 112
            X: =56
            Y: =244
      - LoginErrorLbl:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(220, 38, 38, 1)
            Height: =28
            Size: =12
            Text: =gLoginError
            Visible: =IsBlank(gLoggedInTaxi) And !IsBlank(gLoginError) And gLoginError <> ""
            Width: =Parent.Width - 112
            X: =56
            Y: =298
      - LoginSubmitBtn:
          Control: Classic/Button@2.2.0
          Properties:
            BorderThickness: =0
            Color: =RGBA(255, 255, 255, 1)
            DisabledFill: =RGBA(156, 163, 175, 1)
            DisplayMode: =If(Len(Trim(LoginRadioInput.Text)) > 0, DisplayMode.Edit, DisplayMode.Disabled)
            Fill: =RGBA(0, 70, 127, 1)
            FontWeight: =FontWeight.Bold
            Height: =48
            HoverFill: =RGBA(0, 90, 160, 1)
            OnSelect: |
              =Set(gLoginZone, Left(LoginZoneDropdown.SelectedText.Value, 1));
              Set(gTaxiPositionEdit, false);
              Set(gLoginError, "");
              Set(gExistingTaxi, LookUp(PetraTaxis, RadioId = Trim(LoginRadioInput.Text)));
              If(IsBlank(gExistingTaxi),
                Set(gRegisterTaxiResult,
                  Patch(
                    PetraTaxis,
                    Defaults(PetraTaxis),
                    {
                      Title: Trim(LoginRadioInput.Text),
                      RadioId: Trim(LoginRadioInput.Text),
                      Position: gLoginZone,
                      Capacity: 8,
                      Occupied: 0,
                      Active: true,
                      LastSeen: Now()
                    }
                  )
                ),
                Set(gRegisterTaxiResult,
                  Patch(
                    PetraTaxis,
                    gExistingTaxi,
                    {
                      Title: Trim(LoginRadioInput.Text),
                      RadioId: Trim(LoginRadioInput.Text),
                      Position: gLoginZone,
                      Active: true,
                      LastSeen: Now()
                    }
                  )
                )
              );
              Refresh(PetraTaxis);
              Refresh(PetraTrips);
              ClearCollect(gTaxis,
                ForAll(
                  Filter(PetraTaxis, Active = true),
                  {
                    ID: Value(ID),
                    FunkID: Coalesce(RadioId, ""),
                    Position: Coalesce(Position, ""),
                    Capacity: If(IsBlank(Capacity), 8, Value(Capacity)),
                    Occupied: If(IsBlank(Occupied), 0, Value(Occupied)),
                    Active: Coalesce(Active, false),
                    LastSeen: If(IsBlank(LastSeen), "", Text(LastSeen, "[$-de-DE]hh:mm"))
                  }
                )
              );
              ClearCollect(gTrips,
                ForAll(
                  PetraTrips,
                  {
                    ID: Value(ID),
                    PickupZone: Coalesce(PickupZone, ""),
                    PickupDetail: Coalesce(PickupDetail, ""),
                    DropoffZone: Coalesce(DropoffZone, ""),
                    DropoffDetail: Coalesce(DropoffDetail, ""),
                    Passengers: If(IsBlank(Passengers), 0, Value(Passengers)),
                    Status: Coalesce(Status, ""),
                    OverflowWarning: Coalesce(OverflowWarning, false),
                    TaxiFunkID: Coalesce(TaxiRadioId, ""),
                    TaxiID: If(IsBlank(TaxiId), 0, Value(TaxiId)),
                    TaxiPosition: Coalesce(TaxiPosition, ""),
                    RequestedAt: If(IsBlank(RequestedAt), "", Text(RequestedAt, "[$-de-DE]hh:mm"))
                  }
                )
              );
              Set(gLoggedInTaxi, LookUp(gTaxis, FunkID = Trim(LoginRadioInput.Text)));
              If(IsBlank(gLoggedInTaxi),
                Set(gLoginError, "Taxi konnte nicht angemeldet werden.");
                ClearCollect(gSortedTrips, []),
                Set(gTaxiIdx, LookUp(gZoneMap, zone = gLoggedInTaxi.Position, idx));
                ClearCollect(gSortedTrips,
                  Sort(
                    AddColumns(
                      Filter(gTrips,
                        Status = "pending" Or
                        (Status = "accepted"    And TaxiID = gLoggedInTaxi.ID) Or
                        (Status = "in_progress" And TaxiID = gLoggedInTaxi.ID)
                      ),
                      "Score",
                      If(Status = "pending",
                        Abs(LookUp(gZoneMap, zone = PickupZone, idx) - gTaxiIdx) +
                        Min(LookUp(gZoneMap, zone = PickupZone, idx), 11 - LookUp(gZoneMap, zone = PickupZone, idx)) * 0.5 +
                        If((gTaxiIdx <= 4 And LookUp(gZoneMap, zone = PickupZone, idx) <= 4) Or
                         (gTaxiIdx > 4  And LookUp(gZoneMap, zone = PickupZone, idx) > 4), 0, 2),
                        -1
                      )
                    ),
                    Score,
                    SortOrder.Ascending
                  )
                )
              )
            PressedFill: =RGBA(0, 55, 100, 1)
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =14
            Text: |-
              ="🚕  Anmelden"
            Visible: =IsBlank(gLoggedInTaxi)
            Width: =Parent.Width - 112
            X: =56
            Y: =334
