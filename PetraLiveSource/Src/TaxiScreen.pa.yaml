Screens:
  TaxiScreen:
    Properties:
      Fill: =RGBA(245, 247, 250, 1)
        OnVisible: |
        =Set(gTaxiPositionEdit, false);
        ClearCollect(gTaxis,
          ForAll(
            Filter(PetraTaxis, Active = true),
            {
              ID: Value(ID),
              FunkID: Coalesce(RadioId, ""),
              Position: Coalesce(Position, ""),
              Capacity: If(IsBlank(Capacity), 8, Value(Capacity)),
              Occupied: If(IsBlank(Occupied), 0, Value(Occupied)),
              Active: Coalesce(Active, false),
              LastSeen: If(IsBlank(LastSeen), "", Text(LastSeen, "[$-de-DE]hh:mm"))
            }
          )
        );
        ClearCollect(gTrips,
          ForAll(
            PetraTrips,
            {
              ID: Value(ID),
              PickupZone: Coalesce(PickupZone, ""),
              PickupDetail: Coalesce(PickupDetail, ""),
              DropoffZone: Coalesce(DropoffZone, ""),
              DropoffDetail: Coalesce(DropoffDetail, ""),
              Passengers: If(IsBlank(Passengers), 0, Value(Passengers)),
              Status: Coalesce(Status, ""),
              OverflowWarning: Coalesce(OverflowWarning, false),
              TaxiFunkID: Coalesce(TaxiRadioId, ""),
              TaxiID: If(IsBlank(TaxiId), 0, Value(TaxiId)),
              TaxiPosition: Coalesce(TaxiPosition, ""),
              RequestedAt: If(IsBlank(RequestedAt), "", Text(RequestedAt, "[$-de-DE]hh:mm"))
            }
          )
        );
        If(!IsBlank(gLoggedInTaxi),
          Set(gLoggedInTaxi, LookUp(gTaxis, ID = gLoggedInTaxi.ID))
        );
        If(!IsBlank(gLoggedInTaxi),
          Set(gTaxiIdx, LookUp(gZoneMap, zone = gLoggedInTaxi.Position, idx));
          ClearCollect(gSortedTrips,
            Sort(
              AddColumns(
                Filter(gTrips,
                  Status = "pending" Or
                  (Status = "accepted"    And TaxiID = gLoggedInTaxi.ID) Or
                  (Status = "in_progress" And TaxiID = gLoggedInTaxi.ID)
                ),
                "Score",
                If(Status = "pending",
                  Abs(LookUp(gZoneMap, zone = PickupZone, idx) - gTaxiIdx) +
                  Min(LookUp(gZoneMap, zone = PickupZone, idx),
                    11 - LookUp(gZoneMap, zone = PickupZone, idx)) * 0.5 +
                  If((gTaxiIdx <= 4 And LookUp(gZoneMap, zone = PickupZone, idx) <= 4) Or
                     (gTaxiIdx > 4  And LookUp(gZoneMap, zone = PickupZone, idx) > 4),
                     0, 2),
                  -1
                )
              ),
              Score,
              SortOrder.Ascending
            )
          ),
          Set(gTripToComplete, Blank());
          ClearCollect(gSortedTrips, [])
        )
    Children:
      - TaxiRefreshTimer:
          Control: Timer@2.1.0
          Properties:
            AutoStart: =true
            Duration: =10000
            Height: =0
            OnTimerEnd: |
              =ClearCollect(gTaxis,
                ForAll(
                  Filter(PetraTaxis, Active = true),
                  {
                    ID: Value(ID),
                    FunkID: Coalesce(RadioId, ""),
                    Position: Coalesce(Position, ""),
                    Capacity: If(IsBlank(Capacity), 8, Value(Capacity)),
                    Occupied: If(IsBlank(Occupied), 0, Value(Occupied)),
                    Active: Coalesce(Active, false),
                    LastSeen: If(IsBlank(LastSeen), "", Text(LastSeen, "[$-de-DE]hh:mm"))
                  }
                )
              );
              ClearCollect(gTrips,
                ForAll(
                  PetraTrips,
                  {
                    ID: Value(ID),
                    PickupZone: Coalesce(PickupZone, ""),
                    PickupDetail: Coalesce(PickupDetail, ""),
                    DropoffZone: Coalesce(DropoffZone, ""),
                    DropoffDetail: Coalesce(DropoffDetail, ""),
                    Passengers: If(IsBlank(Passengers), 0, Value(Passengers)),
                    Status: Coalesce(Status, ""),
                    OverflowWarning: Coalesce(OverflowWarning, false),
                    TaxiFunkID: Coalesce(TaxiRadioId, ""),
                    TaxiID: If(IsBlank(TaxiId), 0, Value(TaxiId)),
                    TaxiPosition: Coalesce(TaxiPosition, ""),
                    RequestedAt: If(IsBlank(RequestedAt), "", Text(RequestedAt, "[$-de-DE]hh:mm"))
                  }
                )
              );
              If(!IsBlank(gLoggedInTaxi),
                Set(gLoggedInTaxi, LookUp(gTaxis, ID = gLoggedInTaxi.ID))
              );
              If(!IsBlank(gLoggedInTaxi),
                Set(gTaxiIdx, LookUp(gZoneMap, zone = gLoggedInTaxi.Position, idx));
                ClearCollect(gSortedTrips,
                  Sort(
                    AddColumns(
                      Filter(gTrips,
                        Status = "pending" Or
                        (Status = "accepted"    And TaxiID = gLoggedInTaxi.ID) Or
                        (Status = "in_progress" And TaxiID = gLoggedInTaxi.ID)
                      ),
                      "Score",
                      If(Status = "pending",
                        Abs(LookUp(gZoneMap, zone = PickupZone, idx) - gTaxiIdx) +
                        Min(LookUp(gZoneMap, zone = PickupZone, idx), 11 - LookUp(gZoneMap, zone = PickupZone, idx)) * 0.5 +
                        If((gTaxiIdx <= 4 And LookUp(gZoneMap, zone = PickupZone, idx) <= 4) Or
                         (gTaxiIdx > 4  And LookUp(gZoneMap, zone = PickupZone, idx) > 4), 0, 2),
                        -1
                      )
                    ),
                    Score,
                    SortOrder.Ascending
                  )
                ),
                Set(gTripToComplete, Blank());
                ClearCollect(gSortedTrips, [])
              )
            Repeat: =true
            Visible: =false
            Width: =0
      - TaxiHeaderBg:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(0, 70, 127, 1)
            Height: =56
            Width: =Parent.Width
      - TaxiBackBtn:
          Control: Classic/Button@2.2.0
          Properties:
            BorderThickness: =0
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(0, 0, 0, 0)
            HoverFill: =RGBA(255, 255, 255, 0.15)
            OnSelect: |
              =Set(gLoggedInTaxi, Blank());
              Set(gTaxiPositionEdit, false);
              Set(gTripToComplete, Blank());
              Navigate(SelectRoleScreen, ScreenTransition.Fade)
            PressedFill: =RGBA(255, 255, 255, 0.25)
            Size: =18
            Text: ="←"
            Width: =44
            X: =8
            Y: =8
      - TaxiTitleLabel:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            FontWeight: =FontWeight.Bold
            Height: =56
            Size: =18
            Text: |-
              =If(IsBlank(gLoggedInTaxi), "🚕  Taxi-Fahrer", "🚕  " & gLoggedInTaxi.FunkID)
            Width: =Parent.Width - 200
            X: =58
      - TaxiLogoutBtn:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(255, 255, 255, 0.4)
            BorderThickness: =1
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(255, 255, 255, 0.15)
            Height: =36
            HoverFill: =RGBA(255, 255, 255, 0.25)
            OnSelect: |
              =If(!IsBlank(gLoggedInTaxi),
                Set(gDeactivateTaxiResult,
                  Patch(
                    PetraTaxis,
                    LookUp(PetraTaxis, ID = gLoggedInTaxi.ID),
                    {
                      Active: false,
                      LastSeen: Now()
                    }
                  )
                )
              );
              Refresh(PetraTaxis);
              Refresh(PetraTrips);
              ClearCollect(gTaxis,
                ForAll(
                  Filter(PetraTaxis, Active = true),
                  {
                    ID: Value(ID),
                    FunkID: Coalesce(RadioId, ""),
                    Position: Coalesce(Position, ""),
                    Capacity: If(IsBlank(Capacity), 8, Value(Capacity)),
                    Occupied: If(IsBlank(Occupied), 0, Value(Occupied)),
                    Active: Coalesce(Active, false),
                    LastSeen: If(IsBlank(LastSeen), "", Text(LastSeen, "[$-de-DE]hh:mm"))
                  }
                )
              );
              ClearCollect(gTrips,
                ForAll(
                  PetraTrips,
                  {
                    ID: Value(ID),
                    PickupZone: Coalesce(PickupZone, ""),
                    PickupDetail: Coalesce(PickupDetail, ""),
                    DropoffZone: Coalesce(DropoffZone, ""),
                    DropoffDetail: Coalesce(DropoffDetail, ""),
                    Passengers: If(IsBlank(Passengers), 0, Value(Passengers)),
                    Status: Coalesce(Status, ""),
                    OverflowWarning: Coalesce(OverflowWarning, false),
                    TaxiFunkID: Coalesce(TaxiRadioId, ""),
                    TaxiID: If(IsBlank(TaxiId), 0, Value(TaxiId)),
                    TaxiPosition: Coalesce(TaxiPosition, ""),
                    RequestedAt: If(IsBlank(RequestedAt), "", Text(RequestedAt, "[$-de-DE]hh:mm"))
                  }
                )
              );
              Set(gLoggedInTaxi, Blank());
              Set(gTaxiPositionEdit, false);
              Set(gTripToComplete, Blank());
              ClearCollect(gSortedTrips, [])
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            RadiusTopLeft: =6
            RadiusTopRight: =6
            Size: =12
            Text: ="Abmelden"
            Visible: =!IsBlank(gLoggedInTaxi)
            Width: =108
            X: =Parent.Width - 120
            Y: =10
      - LoginFormCard:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(229, 231, 235, 1)
            BorderThickness: =1
            Fill: =RGBA(255, 255, 255, 1)
            Height: =320
