# ****
# Petra - Taxi Dispatch (No Premium Edition)
# ****
App:
  Properties:
    OnStart: |
      =Set(gRole, "");
      Set(gUserId, User().Email);
    OnVisible: ""
    OnHidden: ""
  Controls:
    - Name: MainScreen
      ControlType: Screen
      Properties:
        Fill: =Color.White
        Height: ="100%"
        Width: ="100%"
        Visible: =true
      Controls:
        - Name: HeaderLabel
          ControlType: Label
          Parent: MainScreen
          Properties:
            Text: ="Petra - Taxi Dispatch"
            X: =20
            Y: =20
            Width: =800
            Height: =50
            Size: =28
            Color: =Color.DarkBlue
            FontWeight: =FontWeight.Bold

        - Name: RoleSelectContainer
          ControlType: Container
          Parent: MainScreen
          Properties:
            X: =20
            Y: =100
            Width: =400
            Height: =300
            Fill: =Color.LightGray

        - Name: DispatchButton
          ControlType: Button
          Parent: RoleSelectContainer
          Properties:
            Text: ="📋 Dispatch Mode"
            X: =20
            Y: =20
            Width: =150
            Height: =50
            OnSelect: =Set(gRole, "dispatch")

        - Name: TaxiButton
          ControlType: Button
          Parent: RoleSelectContainer
          Properties:
            Text: ="🚕 Taxi Mode"
            X: =20
            Y: =90
            Width: =150
            Height: =50
            OnSelect: =Set(gRole, "taxi")

        - Name: EmployeeButton
          ControlType: Button
          Parent: RoleSelectContainer
          Properties:
            Text: ="👤 Employee Mode"
            X: =20
            Y: =160
            Width: =150
            Height: =50
            OnSelect: =Set(gRole, "employee")

        - Name: InfoLabel
          ControlType: Label
          Parent: MainScreen
          Properties:
            Text: ="Selected Role: " & gRole
            X: =20
            Y: =420
            Width: =400
            Height: =30
            Size: =14
