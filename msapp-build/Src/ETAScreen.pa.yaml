Screens:
  EmployeeScreen:
    Properties:
      Fill: =RGBA(245, 247, 250, 1)
      OnVisible: |
        =// Wenn ein aktiver Auftrag verfolgt wird: aktuellen Status nachladen
        // ❗ Dataverse: If(!IsBlank(gActiveTrip), Set(gActiveTrip, LookUp(PetraTrips, ID = gActiveTrip.ID)))
        If(IsBlank(gActiveTrip), Set(gEmployeePassengerCount, 1));
        If(IsBlank(gActiveTrip), Set(gEmployeeFormError, ""));
        Set(gLastRefresh, Text(Now(), "[$-de-DE]hh:mm:ss"))
    Children:

      # ── Auto-Refresh Timer (nur wenn Auftrag aktiv, 10 s) ────────────────────
      - EmployeeRefreshTimer:
          Control: Timer@2.1.0
          Properties:
            X: =0
            Y: =0
            Width: =0
            Height: =0
            Duration: =10000
            Repeat: =true
            AutoStart: =true
            Visible: =false
            OnTimerEnd: |
              =If(!IsBlank(gActiveTrip),
                  // ❗ Dataverse: Set(gActiveTrip, LookUp(PetraTrips, ID = gActiveTrip.ID))
                  // Demo: aktuellen Status aus gTrips lesen
                  Set(gActiveTrip, LookUp(gTrips, ID = gActiveTrip.ID));
                  Set(gLastRefresh, Text(Now(), "[$-de-DE]hh:mm:ss"))
              )

      # ── Header ────────────────────────────────────────────────────────────────
      - EmployeeHeaderBg:
          Control: Rectangle@2.3.0
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =56
            Fill: =RGBA(0, 70, 127, 1)
            BorderThickness: =0

      - EmployeeBackBtn:
          Control: Classic/Button@2.2.0
          Properties:
            X: =8
            Y: =8
            Width: =44
            Height: =40
            Text: ="←"
            Size: =18
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(0, 0, 0, 0)
            HoverFill: =RGBA(255, 255, 255, 0.15)
            PressedFill: =RGBA(255, 255, 255, 0.25)
            BorderThickness: =0
            OnSelect: =Navigate(SelectRoleScreen, ScreenTransition.Fade)

      - EmployeeTitleLabel:
          Control: Label@2.5.1
          Properties:
            X: =58
            Y: =0
            Width: =Parent.Width - 80
            Height: =56
            Text: ="👤  Taxi anfordern"
            Size: =18
            FontWeight: =FontWeight.Bold
            Color: =RGBA(255, 255, 255, 1)
            VerticalAlign: =VerticalAlign.Middle

      # ══════════════════════════════════════════════════════════════════════════
      # ANSICHT 1: AUFTRAGS-FORMULAR (wenn kein aktiver Auftrag)
      # ══════════════════════════════════════════════════════════════════════════
      - FormCard:
          Control: Rectangle@2.3.0
          Properties:
            X: =16
            Y: =68
            Width: =Parent.Width - 32
            Height: =530
            Fill: =RGBA(255, 255, 255, 1)
            BorderColor: =RGBA(229, 231, 235, 1)
            BorderThickness: =1
            Visible: =IsBlank(gActiveTrip)

      # Abholzone
      - PickupZoneLbl:
          Control: Label@2.5.1
          Properties:
            X: =32
            Y: =84
            Width: =Parent.Width - 64
            Height: =24
            Text: ="Abholzone"
            Size: =13
            FontWeight: =FontWeight.Semibold
            Color: =RGBA(55, 65, 81, 1)
            VerticalAlign: =VerticalAlign.Middle
            Visible: =IsBlank(gActiveTrip)

      - PickupZoneDropdown:
          Control: Classic/DropDown@2.3.1
          Properties:
            X: =32
            Y: =110
            Width: =Parent.Width - 64
            Height: =44
            Items: =["E – Echo","F – Foxtrot","H – Hotel","I – India","A – Alpha","B – Bravo","C – Charlie","D – Delta","T – Tango","G – Golf","P – Papa","W – Whisky"]
            Default: ="A – Alpha"
            Visible: =IsBlank(gActiveTrip)

      - PickupDetailLbl:
          Control: Label@2.5.1
          Properties:
            X: =32
            Y: =162
            Width: =Parent.Width - 64
            Height: =24
            Text: ="Abholdetail  (optional, z. B. Pos 3)"
            Size: =13
            FontWeight: =FontWeight.Semibold
            Color: =RGBA(55, 65, 81, 1)
            VerticalAlign: =VerticalAlign.Middle
            Visible: =IsBlank(gActiveTrip)

      - PickupDetailInput:
          Control: Classic/TextInput@2.3.2
          Properties:
            X: =32
            Y: =188
            Width: =Parent.Width - 64
            Height: =44
            HintText: ="z. B. Pos 3  (optional)"
            Size: =14
            BorderColor: =RGBA(209, 213, 219, 1)
            FocusedBorderColor: =RGBA(59, 130, 246, 1)
            BorderThickness: =1
            RadiusTopLeft: =6
            RadiusTopRight: =6
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            Visible: =IsBlank(gActiveTrip)

      # Zielzone
      - DropoffZoneLbl:
          Control: Label@2.5.1
          Properties:
            X: =32
            Y: =242
            Width: =Parent.Width - 64
            Height: =24
            Text: ="Zielzone"
            Size: =13
            FontWeight: =FontWeight.Semibold
            Color: =RGBA(55, 65, 81, 1)
            VerticalAlign: =VerticalAlign.Middle
            Visible: =IsBlank(gActiveTrip)

      - DropoffZoneDropdown:
          Control: Classic/DropDown@2.3.1
          Properties:
            X: =32
            Y: =268
            Width: =Parent.Width - 64
            Height: =44
            Items: =["E – Echo","F – Foxtrot","H – Hotel","I – India","A – Alpha","B – Bravo","C – Charlie","D – Delta","T – Tango","G – Golf","P – Papa","W – Whisky"]
            Default: ="B – Bravo"
            Visible: =IsBlank(gActiveTrip)

      - DropoffDetailLbl:
          Control: Label@2.5.1
          Properties:
            X: =32
            Y: =320
            Width: =Parent.Width - 64
            Height: =24
            Text: ="Zieldetail  (optional)"
            Size: =13
            FontWeight: =FontWeight.Semibold
            Color: =RGBA(55, 65, 81, 1)
            VerticalAlign: =VerticalAlign.Middle
            Visible: =IsBlank(gActiveTrip)

      - DropoffDetailInput:
          Control: Classic/TextInput@2.3.2
          Properties:
            X: =32
            Y: =346
            Width: =Parent.Width - 64
            Height: =44
            HintText: ="z. B. Gate 7  (optional)"
            Size: =14
            BorderColor: =RGBA(209, 213, 219, 1)
            FocusedBorderColor: =RGBA(59, 130, 246, 1)
            BorderThickness: =1
            RadiusTopLeft: =6
            RadiusTopRight: =6
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            Visible: =IsBlank(gActiveTrip)

      # Anzahl Personen
      - PassengersLbl:
          Control: Label@2.5.1
          Properties:
            X: =32
            Y: =400
            Width: =Parent.Width - 64
            Height: =24
            Text: |
              ="Anzahl Mitfahrende (inkl. Sie):  " & Text(gEmployeePassengerCount)
            Size: =13
            FontWeight: =FontWeight.Semibold
            Color: =RGBA(55, 65, 81, 1)
            VerticalAlign: =VerticalAlign.Middle
            Visible: =IsBlank(gActiveTrip)

      - PassengerStepperDecBtn:
          Control: Classic/Button@2.2.0
          Properties:
            X: =32
            Y: =426
            Width: =56
            Height: =56
            Text: ="-"
            Size: =22
            FontWeight: =FontWeight.Bold
            Color: =RGBA(31, 41, 55, 1)
            Fill: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(243, 244, 246, 1)
            PressedFill: =RGBA(229, 231, 235, 1)
            DisabledFill: =RGBA(243, 244, 246, 1)
            DisabledColor: =RGBA(156, 163, 175, 1)
            BorderColor: =RGBA(209, 213, 219, 1)
            BorderThickness: =1
            RadiusTopLeft: =12
            RadiusTopRight: =12
            RadiusBottomLeft: =12
            RadiusBottomRight: =12
            DisplayMode: =If(gEmployeePassengerCount <= 1, DisplayMode.Disabled, DisplayMode.Edit)
            OnSelect: =Set(gEmployeePassengerCount, Max(1, gEmployeePassengerCount - 1))
            Visible: =IsBlank(gActiveTrip)

      - PassengerStepperValueLbl:
          Control: Label@2.5.1
          Properties:
            X: =96
            Y: =426
            Width: =Parent.Width - 192
            Height: =56
            Text: =Text(gEmployeePassengerCount)
            Size: =24
            FontWeight: =FontWeight.Bold
            Color: =RGBA(17, 24, 39, 1)
            Align: =Align.Center
            VerticalAlign: =VerticalAlign.Middle
            Visible: =IsBlank(gActiveTrip)

      - PassengerStepperIncBtn:
          Control: Classic/Button@2.2.0
          Properties:
            X: =Parent.Width - 88
            Y: =426
            Width: =56
            Height: =56
            Text: ="+"
            Size: =22
            FontWeight: =FontWeight.Bold
            Color: =RGBA(31, 41, 55, 1)
            Fill: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(243, 244, 246, 1)
            PressedFill: =RGBA(229, 231, 235, 1)
            DisabledFill: =RGBA(243, 244, 246, 1)
            DisabledColor: =RGBA(156, 163, 175, 1)
            BorderColor: =RGBA(209, 213, 219, 1)
            BorderThickness: =1
            RadiusTopLeft: =12
            RadiusTopRight: =12
            RadiusBottomLeft: =12
            RadiusBottomRight: =12
            DisplayMode: =If(gEmployeePassengerCount >= 16, DisplayMode.Disabled, DisplayMode.Edit)
            OnSelect: =Set(gEmployeePassengerCount, Min(16, gEmployeePassengerCount + 1))
            Visible: =IsBlank(gActiveTrip)

      # Fehleranzeige
      - FormErrorLbl:
          Control: Label@2.5.1
          Properties:
            X: =32
            Y: =492
            Width: =Parent.Width - 64
            Height: =32
            Text: =gEmployeeFormError
            Size: =12
            Color: =RGBA(220, 38, 38, 1)
            Fill: =RGBA(254, 242, 242, 1)
            VerticalAlign: =VerticalAlign.Middle
            Visible: =IsBlank(gActiveTrip) And !IsBlank(gEmployeeFormError) And gEmployeeFormError <> ""

      # Absenden-Button
      - SubmitTripBtn:
          Control: Classic/Button@2.2.0
          Properties:
            X: =16
            Y: =612
            Width: =Parent.Width - 32
            Height: =52
            Text: ="🚕  Taxi anfordern"
            Size: =15
            FontWeight: =FontWeight.Bold
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(0, 70, 127, 1)
            HoverFill: =RGBA(0, 90, 160, 1)
            PressedFill: =RGBA(0, 55, 100, 1)
            DisabledFill: =RGBA(156, 163, 175, 1)
            BorderThickness: =0
            RadiusTopLeft: =10
            RadiusTopRight: =10
            RadiusBottomLeft: =10
            RadiusBottomRight: =10
            Visible: =IsBlank(gActiveTrip)
            DisplayMode: =If(
                Left(PickupZoneDropdown.SelectedText.Value, 1) <> Left(DropoffZoneDropdown.SelectedText.Value, 1),
                DisplayMode.Edit,
                DisplayMode.Disabled)
            OnSelect: |
              =// Validierung
              Set(gEmployeeFormError, "");
              If(Left(PickupZoneDropdown.SelectedText.Value, 1) = Left(DropoffZoneDropdown.SelectedText.Value, 1),
                  Set(gEmployeeFormError, "Abholzone und Zielzone müssen verschieden sein.");
                  false,
                  // ❗ Dataverse: Collect(PetraTrips, {...}); Set(gActiveTrip, Last(PetraTrips))
                  Collect(gTrips, {
                      ID:             gNextTripID,
                      PickupZone:     Left(PickupZoneDropdown.SelectedText.Value, 1),
                      PickupDetail:   PickupDetailInput.Text,
                      DropoffZone:    Left(DropoffZoneDropdown.SelectedText.Value, 1),
                      DropoffDetail:  DropoffDetailInput.Text,
                      Passengers:     gEmployeePassengerCount,
                      Status:         "pending",
                      OverflowWarning: false,
                      TaxiFunkID:     "",
                      TaxiID:         0,
                      TaxiPosition:   "",
                      RequestedAt:    Text(Now(), "hh:mm")
                  });
                  Set(gNextTripID, gNextTripID + 1);
                  Set(gActiveTrip, LookUp(gTrips, ID = gNextTripID - 1))
              )

      # ══════════════════════════════════════════════════════════════════════════
      # ANSICHT 2: AUFTRAGSSTATUS (wenn Auftrag aktiv)
      # ══════════════════════════════════════════════════════════════════════════

      # Status-Karte (farblich je nach Status)
      - TripStatusCard:
          Control: Rectangle@2.3.0
          Properties:
            X: =16
            Y: =68
            Width: =Parent.Width - 32
            Height: =136
            Fill: =If(!IsBlank(gActiveTrip),
                If(gActiveTrip.Status = "pending",    RGBA(254, 249, 195, 0.5),
                If(gActiveTrip.Status = "accepted",   RGBA(219, 234, 254, 0.5),
                If(gActiveTrip.Status = "in_progress",RGBA(209, 250, 229, 0.5),
                If(gActiveTrip.Status = "completed",  RGBA(220, 252, 231, 0.5),
                RGBA(243, 244, 246, 0.5))))),
                RGBA(255, 255, 255, 1))
            BorderColor: =If(!IsBlank(gActiveTrip),
                If(gActiveTrip.Status = "pending",    RGBA(253, 230, 138, 1),
                If(gActiveTrip.Status = "accepted",   RGBA(147, 197, 253, 1),
                If(gActiveTrip.Status = "in_progress",RGBA(110, 231, 183, 1),
                If(gActiveTrip.Status = "completed",  RGBA(134, 239, 172, 1),
                RGBA(229, 231, 235, 1))))),
                RGBA(229, 231, 235, 1))
            BorderThickness: =2
            Visible: =!IsBlank(gActiveTrip)

      - TripStatusIcon:
          Control: Label@2.5.1
          Properties:
            X: =28
            Y: =80
            Width: =60
            Height: =60
            Text: =If(!IsBlank(gActiveTrip),
                If(gActiveTrip.Status = "pending",    "⏳",
                If(gActiveTrip.Status = "accepted",   "🚕",
                If(gActiveTrip.Status = "in_progress","📍",
                If(gActiveTrip.Status = "completed",  "✅", "❌")))),
                "")
            Size: =36
            Align: =Align.Center
            VerticalAlign: =VerticalAlign.Middle
            Visible: =!IsBlank(gActiveTrip)

      - TripStatusTextLbl:
          Control: Label@2.5.1
          Properties:
            X: =96
            Y: =80
            Width: =Parent.Width - 128
            Height: =32
            Text: =If(!IsBlank(gActiveTrip),
                If(gActiveTrip.Status = "pending",     "Warte auf Taxifahrer…",
                If(gActiveTrip.Status = "accepted",    "Taxi ist unterwegs zu Ihnen.",
                If(gActiveTrip.Status = "in_progress", "Fahrt läuft.",
                If(gActiveTrip.Status = "completed",   "Fahrt abgeschlossen. Vielen Dank!",
                "Auftrag storniert.")))),
                "")
            Size: =15
            FontWeight: =FontWeight.Bold
            Color: =If(!IsBlank(gActiveTrip),
                If(gActiveTrip.Status = "pending",    RGBA(133, 77, 14, 1),
                If(gActiveTrip.Status = "accepted",   RGBA(30, 64, 175, 1),
                If(gActiveTrip.Status = "in_progress",RGBA(22, 101, 52, 1),
                If(gActiveTrip.Status = "completed",  RGBA(22, 101, 52, 1),
                RGBA(75, 85, 99, 1))))),
                RGBA(17, 24, 39, 1))
            VerticalAlign: =VerticalAlign.Middle
            Visible: =!IsBlank(gActiveTrip)

      - TripStatusRefreshLbl:
          Control: Label@2.5.1
          Properties:
            X: =96
            Y: =116
            Width: =Parent.Width - 128
            Height: =20
            Text: |
              ="⟳ zuletzt: " & gLastRefresh
            Size: =11
            Color: =RGBA(156, 163, 175, 1)
            VerticalAlign: =VerticalAlign.Middle
            Visible: =!IsBlank(gActiveTrip) And (gActiveTrip.Status = "pending" Or gActiveTrip.Status = "accepted" Or gActiveTrip.Status = "in_progress")

      # Auftrags-Details
      - TripDetailCard:
          Control: Rectangle@2.3.0
          Properties:
            X: =16
            Y: =214
            Width: =Parent.Width - 32
            Height: =180
            Fill: =RGBA(255, 255, 255, 1)
            BorderColor: =RGBA(229, 231, 235, 1)
            BorderThickness: =1
            Visible: =!IsBlank(gActiveTrip)

      - TripDetailRouteLbl:
          Control: Label@2.5.1
          Properties:
            X: =28
            Y: =224
            Width: =Parent.Width - 56
            Height: =28
            Text: =If(!IsBlank(gActiveTrip), gActiveTrip.PickupZone & If(IsBlank(gActiveTrip.PickupDetail) Or gActiveTrip.PickupDetail = "", "", " (" & gActiveTrip.PickupDetail & ")") & "  →  " & gActiveTrip.DropoffZone & If(IsBlank(gActiveTrip.DropoffDetail) Or gActiveTrip.DropoffDetail = "", "", " (" & gActiveTrip.DropoffDetail & ")"), "")
            Size: =16
            FontWeight: =FontWeight.Bold
            Color: =RGBA(17, 24, 39, 1)
            VerticalAlign: =VerticalAlign.Middle
            Visible: =!IsBlank(gActiveTrip)

      - TripDetailZoneNamesLbl:
          Control: Label@2.5.1
          Properties:
            X: =28
            Y: =254
            Width: =Parent.Width - 56
            Height: =22
            Text: =If(!IsBlank(gActiveTrip), LookUp(gZoneMap, zone = gActiveTrip.PickupZone, label) & "  →  " & LookUp(gZoneMap, zone = gActiveTrip.DropoffZone, label), "")
            Size: =12
            Color: =RGBA(107, 114, 128, 1)
            VerticalAlign: =VerticalAlign.Middle
            Visible: =!IsBlank(gActiveTrip)

      - TripDetailMetaLbl:
          Control: Label@2.5.1
          Properties:
            X: =28
            Y: =278
            Width: =Parent.Width - 56
            Height: =22
            Text: =If(!IsBlank(gActiveTrip), "👥 " & Text(gActiveTrip.Passengers) & " Personen  ·  🕐 " & gActiveTrip.RequestedAt, "")
            Size: =12
            Color: =RGBA(107, 114, 128, 1)
            VerticalAlign: =VerticalAlign.Middle
            Visible: =!IsBlank(gActiveTrip)

      - TripDetailTaxiLbl:
          Control: Label@2.5.1
          Properties:
            X: =28
            Y: =302
            Width: =Parent.Width - 56
            Height: =22
            Text: |
              =If(!IsBlank(gActiveTrip) And !IsBlank(gActiveTrip.TaxiFunkID) And gActiveTrip.TaxiFunkID <> "", "🚕 Fahrzeug: " & gActiveTrip.TaxiFunkID, "🚕 Noch kein Fahrzeug zugewiesen")
            Size: =12
            FontWeight: =If(!IsBlank(gActiveTrip) And !IsBlank(gActiveTrip.TaxiFunkID) And gActiveTrip.TaxiFunkID <> "", FontWeight.Semibold, FontWeight.Normal)
            Color: =If(!IsBlank(gActiveTrip) And !IsBlank(gActiveTrip.TaxiFunkID) And gActiveTrip.TaxiFunkID <> "", RGBA(37, 99, 235, 1), RGBA(107, 114, 128, 1))
            VerticalAlign: =VerticalAlign.Middle
            Visible: =!IsBlank(gActiveTrip)

      # ETA-Anzeige (wenn Taxi angenommen und Position bekannt)
      - TripDetailETALbl:
          Control: Label@2.5.1
          Properties:
            X: =28
            Y: =328
            Width: =Parent.Width - 56
            Height: =24
            Text: |
              =If(!IsBlank(gActiveTrip) And gActiveTrip.Status = "accepted" And !IsBlank(gActiveTrip.TaxiPosition) And gActiveTrip.TaxiPosition <> "",
                "⏱ ETA: " & If(
                Abs(LookUp(gZoneMap, zone = gActiveTrip.TaxiPosition, idx) - LookUp(gZoneMap, zone = gActiveTrip.PickupZone, idx)) = 0,
                "Taxi ist vor Ort",
                Text(Round(Abs(LookUp(gZoneMap, zone = gActiveTrip.TaxiPosition, idx) - LookUp(gZoneMap, zone = gActiveTrip.PickupZone, idx)) * 1.6, 0)) & " Min. bis zu Ihnen"
                ),
                "")
            Size: =13
            FontWeight: =FontWeight.Semibold
            Color: =RGBA(37, 99, 235, 1)
            VerticalAlign: =VerticalAlign.Middle
            Visible: =!IsBlank(gActiveTrip) And gActiveTrip.Status = "accepted" And !IsBlank(gActiveTrip.TaxiPosition) And gActiveTrip.TaxiPosition <> ""

      # Neuer Auftrag / Zurücksetzen-Button
      - NewTripBtn:
          Control: Classic/Button@2.2.0
          Properties:
            X: =16
            Y: =410
            Width: =Parent.Width - 32
            Height: =50
            Text: =If(!IsBlank(gActiveTrip) And (gActiveTrip.Status = "completed" Or gActiveTrip.Status = "cancelled"), "✚  Neuen Auftrag erstellen", "✕  Auftrag stornieren")
            Size: =14
            FontWeight: =FontWeight.Bold
            Color: =RGBA(255, 255, 255, 1)
            Fill: =If(!IsBlank(gActiveTrip) And (gActiveTrip.Status = "completed" Or gActiveTrip.Status = "cancelled"), RGBA(0, 70, 127, 1), RGBA(220, 38, 38, 1))
            HoverFill: =If(!IsBlank(gActiveTrip) And (gActiveTrip.Status = "completed" Or gActiveTrip.Status = "cancelled"), RGBA(0, 90, 160, 1), RGBA(185, 28, 28, 1))
            BorderThickness: =0
            RadiusTopLeft: =10
            RadiusTopRight: =10
            RadiusBottomLeft: =10
            RadiusBottomRight: =10
            Visible: =!IsBlank(gActiveTrip)
            OnSelect: |
              =If(!IsBlank(gActiveTrip) And gActiveTrip.Status = "pending",
                  // Auftrag stornieren
                  UpdateIf(gTrips, ID = gActiveTrip.ID, {Status: "cancelled"})
              );
              Reset(PickupZoneDropdown);
              Reset(PickupDetailInput);
              Reset(DropoffZoneDropdown);
              Reset(DropoffDetailInput);
              Set(gEmployeePassengerCount, 1);
              Set(gActiveTrip, Blank());
              Set(gEmployeeFormError, "")
