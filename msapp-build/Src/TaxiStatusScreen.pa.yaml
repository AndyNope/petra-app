                  Width: =200
                  Height: =28
                  Text: =If(ThisItem.Active, "🟢 Aktiv", "🔴 Inaktiv")
                  Size: =13
                  Color: =If(ThisItem.Active, RGBA(0, 140, 60, 1), RGBA(200, 30, 30, 1))
            - TaxiZoneLabel:
                Control: Label@2.5.1
                Properties:
                  X: =16
                  Y: =78
                  Width: =300
                  Height: =26
                  Text: |
                    ="Zone: " & ThisItem.Position & "  |  Freie Plätze: " & Text(ThisItem.Capacity - ThisItem.Occupied)
                  Size: =13
                  Color: =RGBA(70, 70, 70, 1)
      - StatusBackButton:
          Control: Classic/Button@2.2.0
          Properties:
            X: =40
