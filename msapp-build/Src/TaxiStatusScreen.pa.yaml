              ="Aktive Fahrzeuge: " & Text(CountRows(Filter(gTaxis, Active))) & " / " & Text(CountRows(gTaxis))
            Size: =14
            FontWeight: =FontWeight.Semibold
            Color: =RGBA(50, 50, 50, 1)
      - TaxiStatusGallery:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            X: =40
            Y: =140
            Width: =680
            Height: =480
            Items: =gTaxis
            TemplateSize: =120
            TemplatePadding: =8
          Children:
            - TaxiStatusCardRect:
                Control: Rectangle@2.3.0
                Properties:
                  X: =0
                  Y: =0
                  Width: =Parent.TemplateWidth
                  Height: =Parent.TemplateHeight - 8
                  Fill: =RGBA(255, 255, 255, 1)
                  BorderColor: =If(ThisItem.Active, RGBA(0, 140, 60, 1), RGBA(200, 200, 200, 1))
                  BorderThickness: =2
            - TaxiFunkLabel:
                Control: Label@2.5.1
                Properties:
                  X: =16
                  Y: =10
                  Width: =400
                  Height: =32
